# When a release is published: attach the project as a zip named for
# RecompLauncher (one file per system, "Windows-x64" in its name), with
# recomplauncher.json at its top. It is the same zip as tools/make-release.py
# makes: the project as committed, no game code and no ROM. The player's
# RecompLauncher then builds the game from their own ROM (BUILD.bat --prepare).
name: Release zip
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Make the zip
        run: python3 tools/make-release.py out
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip=$(ls out/*/DQIX-PC-*.zip | grep -v -- -extras.zip)
          name="Dragon-Quest-IX-Modern-$TAG-Windows-x64.zip"
          cp "$zip" "$name"
          gh release upload "$TAG" "$name" --clobber
